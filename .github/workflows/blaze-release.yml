# Fork only (branch blaze-integration; not for upstream): publishes
# `pixi-blaze` -- this pixi with rattler-blaze embedded, plus the recipe
# backends -- to prefix.dev/wolfv/experiments for linux-64 and osx-arm64,
# with trusted publishing (the channel trusts this repository's
# blaze-release.yml). rattler-blaze is checked out next to pixi (the Cargo
# path dependencies) and has the packaging recipe.
name: blaze-release

on:
  push:
    branches: [blaze-integration]
  workflow_dispatch:
    inputs:
      rattler-blaze-ref:
        description: "rattler-blaze branch or commit to build against"
        default: pixi-integration

permissions:
  contents: read
  id-token: write # trusted publishing to prefix.dev

concurrency:
  group: blaze-release-${{ github.ref }}
  cancel-in-progress: true

env:
  CHANNEL: https://prefix.dev/wolfv/experiments

jobs:
  pixi-blaze:
    name: pixi-blaze (${{ matrix.subdir }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04 # glibc 2.35: what the package requires
            subdir: linux-64
          - os: macos-14
            subdir: osx-arm64
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          path: pixi
      - uses: actions/checkout@v4
        with:
          repository: prefix-dev/rattler-blaze
          ref: ${{ inputs.rattler-blaze-ref || 'pixi-integration' }}
          path: rattler-blaze
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pixi
      - name: Build pixi and the recipe backends
        working-directory: pixi
        run: cargo build --release --locked -p pixi -p pixi_build_blaze
      - uses: prefix-dev/setup-pixi@v0.9.6
        with:
          run-install: false
      - name: Package and publish
        # --build-number=+1: one more than the newest in the channel.
        run: |
          export BIN_DIR="$PWD/pixi/target/release"
          export PIXI_VERSION="$("$BIN_DIR/pixi" --version | awk '{print $2}')"
          pixi exec rattler-build publish \
            rattler-blaze/packaging/pixi-blaze/recipe.yaml --to "$CHANNEL" --build-number=+1
