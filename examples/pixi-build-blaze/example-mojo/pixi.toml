# A pixi workspace with a Mojo package. The `pixi-build-mojo` backend (the
# recipe-only one from pixi_build_blaze) finds the packages, the program and
# the tests itself; blaze builds one cached action per package, program,
# test build and test run.
[workspace]
name = "blaze-mojo-demo"
channels = ["https://conda.modular.com/max", "https://prefix.dev/conda-forge"]
platforms = ["linux-64", "osx-arm64"]
preview = ["pixi-build", "pixi-build-blaze"]

[dependencies]
mojodemo = { path = "packages/mojodemo" }

[tasks]
demo = "mojodemo"
